  <desc>Coral and maroon placeholder representing the TaskFlow project screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#800000"/>
      <stop offset="45%" stop-color="#DC143C"/>
